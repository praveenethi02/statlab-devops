
services:
  backend:
    image: statlab-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_PATH: /data/accounts.sqlite3
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
    expose:
      - "8000"
    volumes:
      - statlab-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    image: statlab-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  statlab-data:
